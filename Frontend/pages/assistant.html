<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPath AI - Assistant</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/assistant.css">
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">🧠 LearnPath <span>AI</span></div>
        <nav class="side-nav">
            <a href="profile.html">My Learning</a>
            <a href="roadmap.html">Roadmaps</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assistant.html" class="active">AI Assistant</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="top-bar" style="justify-content: flex-end;">
            <div class="user-profile">
                <div class="user-info">
                    <strong id="topNavName">Student</strong>
                    <span>Student</span>
                </div>
            </div>
        </header>

        <div class="assistant-header">
            <h1>Ask your learning mentor</h1>
            <p>Get explanations about your roadmap, skill gaps, and study plan.</p>
        </div>

        <section class="chat-box">
            <div class="messages" id="messages">
                <div class="message ai" id="aiWelcomeMessage">
                    Hi! 👋 I'm your learning assistant. Ask me why something was recommended, what your skill gaps are, or how to adjust your roadmap.
                </div>
            </div>

            <form id="chatForm">
                <input type="text" id="chatInput" placeholder="Ask anything... e.g., 'Why did you recommend Machine Learning?'" autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
</div>

<script src="../js/assistant.js"></script>
<!-- Updated Session Script -->
<script>
    const savedProfile = JSON.parse(sessionStorage.getItem("learnPathProfile"));
    
    const topName = document.getElementById("topNavName");
    const aiWelcome = document.getElementById("aiWelcomeMessage");

    if (savedProfile && savedProfile.name) {
        const firstName = savedProfile.name.split(" ")[0];
        
        if (topName) topName.textContent = firstName;
        if (aiWelcome) aiWelcome.textContent = `Hi ${firstName}! 👋 I'm your learning assistant. Ask me why something was recommended, what your skill gaps are, or how to adjust your roadmap.`;
    } else {
        if (topName) topName.textContent = "Student";
        if (aiWelcome) aiWelcome.textContent = `Hi! 👋 I'm your learning assistant. Ask me why something was recommended, what your skill gaps are, or how to adjust your roadmap.`;
    }
</script>
</body>
</html>
