<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPath AI - Profile</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">🧠 LearnPath <span>AI</span></div>
        <nav class="side-nav">
            <a href="profile.html" class="active">My Learning</a>
            <a href="roadmap.html">Roadmaps</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assistant.html">AI Assistant</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="top-bar" style="justify-content: flex-end;">
            <div class="user-profile">
                <div class="user-info">
                    <strong id="topNavName">Student</strong>
                    <span>Student</span>
                </div>
            </div>
        </header>

        <div class="profile-header">
            <h1>Set up your learning profile</h1>
            <p>Your profile drives the recommendation engine.</p>
        </div>

        <section class="profile-card">
            <form id="profileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Career / Learning Goal</label>
                        <select id="career">
                            <option>NLP Engineer</option>
                            <option>Machine Learning Engineer</option>
                            <option>Data Scientist</option>
                            <option>AI Engineer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Experience Level</label>
                        <select id="experience">
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Current Skills <span>(Comma separated)</span></label>
                    <input type="text" id="skills" placeholder="e.g., Python, C++, NLP">
                </div>

                <div class="form-group">
                    <label>Interests <span>(Comma separated)</span></label>
                    <input type="text" id="interests" placeholder="e.g., Machine Learning, AI">
                </div>

                <div class="form-group">
                    <label>Completed Courses <span>(Comma separated)</span></label>
                    <input type="text" id="completed" placeholder="e.g., Python Basics">
                </div>

                <div class="form-row three-columns">
                    <div class="form-group">
                        <label>Learning Style</label>
                        <select id="learningStyle">
                            <option>Mixed</option>
                            <option>Visual</option>
                            <option>Hands-on</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Hours / Week</label>
                        <input type="number" id="hours" placeholder="e.g., 4" min="1">
                    </div>
                    <div class="form-group">
                        <label>Target Months</label>
                        <input type="number" id="months" placeholder="e.g., 6" min="1">
                    </div>
                </div>

                <button type="submit" class="generate-btn">Generate Personalized Roadmap →</button>
            </form>
        </section>
    </main>
</div>

<script src="../js/profile.js"></script>
</body>
</html>
