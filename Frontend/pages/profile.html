<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LearnPath AI - Profile</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/profile.css"
    >

</head>


<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">
        LearnPath <span>AI</span>
    </div>


    <nav>

        <a
            href="profile.html"
            class="active"
        >
            Profile
        </a>


        <a href="roadmap.html">
            Roadmap
        </a>


        <a href="dashboard.html">
            Dashboard
        </a>


        <a href="assistant.html">
            AI Assistant
        </a>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main class="profile-page">

    <div class="step-badge">
        STEP 1
    </div>


    <h1>
        Tell us about your learning goals
    </h1>


    <p class="page-description">
        Your profile drives the recommendation engine.
    </p>


    <!-- ================= PROFILE FORM ================= -->

    <section class="profile-card">

        <!-- IMPORTANT:
             autocomplete="off" prevents browser
             from intentionally restoring old form data.
        -->

        <form
            id="profileForm"
            autocomplete="off"
        >


            <!-- ================= NAME ================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Name
                    </label>


                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ================= EMAIL ================= -->

                <div class="form-group">

                    <label>
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="off"
                        required
                    >

                </div>

            </div>


            <!-- ================= CAREER ================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Career / Learning Goal
                    </label>


                    <select
                        id="career"
                        autocomplete="off"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select your goal
                        </option>


                        <option>
                            NLP Engineer
                        </option>


                        <option>
                            Machine Learning Engineer
                        </option>


                        <option>
                            Data Scientist
                        </option>


                        <option>
                            AI Engineer
                        </option>


                        <option>
                            Data Analyst
                        </option>

                    </select>

                </div>


                <!-- ================= EXPERIENCE ================= -->

                <div class="form-group">

                    <label>
                        Experience Level
                    </label>


                    <select
                        id="experience"
                        autocomplete="off"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select experience level
                        </option>


                        <option>
                            Beginner
                        </option>


                        <option>
                            Intermediate
                        </option>


                        <option>
                            Advanced
                        </option>

                    </select>

                </div>

            </div>


            <!-- ================= CURRENT SKILLS ================= -->

            <div class="form-group">

                <label>

                    Current Skills

                    <span>
                        Comma separated
                    </span>

                </label>


                <input
                    type="text"
                    id="skills"
                    placeholder="Python, C++, NLP"
                    autocomplete="off"
                >

            </div>


            <!-- ================= INTERESTS ================= -->

            <div class="form-group">

                <label>

                    Interests

                    <span>
                        Comma separated
                    </span>

                </label>


                <input
                    type="text"
                    id="interests"
                    placeholder="Machine Learning, AI"
                    autocomplete="off"
                >

            </div>


            <!-- ================= COMPLETED ================= -->

            <div class="form-group">

                <label>

                    Completed Courses / Skills

                    <span>
                        Comma separated
                    </span>

                </label>


                <input
                    type="text"
                    id="completed"
                    placeholder="Python, C"
                    autocomplete="off"
                >

            </div>


            <!-- ================= LAST ROW ================= -->

            <div class="form-row three-columns">


                <!-- ================= LEARNING STYLE ================= -->

                <div class="form-group">

                    <label>
                        Learning Style
                    </label>


                    <select
                        id="learningStyle"
                        autocomplete="off"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select learning style
                        </option>


                        <option>
                            Mixed
                        </option>


                        <option>
                            Visual
                        </option>


                        <option>
                            Reading
                        </option>


                        <option>
                            Hands-on
                        </option>

                    </select>

                </div>


                <!-- ================= HOURS ================= -->

                <div class="form-group">

                    <label>
                        Hours / Week
                    </label>


                    <input
                        type="number"
                        id="hours"
                        placeholder="Enter hours per week"
                        min="1"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ================= MONTHS ================= -->

                <div class="form-group">

                    <label>
                        Target Months
                    </label>


                    <input
                        type="number"
                        id="months"
                        placeholder="Enter target months"
                        min="1"
                        autocomplete="off"
                        required
                    >

                </div>

            </div>


            <!-- ================= BUTTON ================= -->

            <button
                type="submit"
                class="generate-btn"
            >

                Generate Personalized Roadmap →

            </button>


        </form>

    </section>

</main>


<script src="../js/profile.js"></script>

</body>

</html>
