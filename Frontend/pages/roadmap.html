<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LearnPath AI - Roadmap
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/roadmap.css"
    >

</head>


<body>

<div class="app-container">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="logo">
            🧠 LearnPath <span>AI</span>
        </div>


        <nav class="side-nav">

            <a href="profile.html">
                My Learning
            </a>


            <a
                href="roadmap.html"
                class="active"
            >
                Roadmaps
            </a>


            <a href="dashboard.html">
                Dashboard
            </a>


            <a href="assistant.html">
                AI Assistant
            </a>

        </nav>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">


        <!-- TOP BAR -->

        <header
            class="top-bar"
            style="justify-content: flex-end;"
        >

            <div class="user-profile">

                <div class="user-info">

                    <strong id="topNavName">
                        Student
                    </strong>


                    <span>
                        Student
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================================
             ROADMAP HEADER
             ================================================= -->

        <div class="roadmap-header">

            <h1 id="roadmapTitle">
                Your Learning Journey
            </h1>


            <p id="roadmapSubtitle">
                Estimated timeline based on your profile
            </p>


            <p
                id="roadmapGoal"
                style="display:none;"
            ></p>

        </div>


        <!-- =================================================
             SUMMARY
             ================================================= -->

        <section
            class="summary-grid"
        >

            <div class="summary-card">

                <p>
                    Goal Readiness
                </p>


                <strong
                    id="readinessPercentage"
                >
                    0%
                </strong>

            </div>


            <div class="summary-card">

                <p>
                    Skills You Have
                </p>


                <strong
                    id="skillsHave"
                >
                    0
                </strong>

            </div>


            <div class="summary-card">

                <p>
                    Skills To Learn
                </p>


                <strong
                    id="skillsToLearn"
                >
                    0
                </strong>

            </div>


            <div class="summary-card">

                <p>
                    Recommended Steps
                </p>


                <strong
                    id="recommendedSteps"
                >
                    0
                </strong>

            </div>

        </section>


        <!-- =================================================
             SKILL MAP
             ================================================= -->

        <section
            class="skill-gap"
        >

            <h2>
                Skill Map
            </h2>


            <div
                class="skill-tags"
                id="skillTags"
            ></div>

        </section>


        <!-- =================================================
             ROADMAP
             ================================================= -->

        <section
            id="roadmapContainer"
        ></section>


        <!-- =================================================
             TOP AI RECOMMENDATIONS
             ================================================= -->

        <section
            class="recommendations"
        >

            <h2>
                Top AI Recommendations
            </h2>


            <div
                class="recommendation-grid"
                id="recommendationContainer"
            ></div>

        </section>

    </main>

</div>


<!-- =====================================================
     ROADMAP JAVASCRIPT
     ===================================================== -->

<script src="../js/roadmap.js"></script>


</body>

</html>
