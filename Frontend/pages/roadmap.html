<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LearnPath AI - Roadmap
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/roadmap.css"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        LearnPath <span>AI</span>
    </div>

    <nav>

        <a href="profile.html">
            Profile
        </a>

        <a
            href="roadmap.html"
            class="active"
        >
            Roadmap
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="assistant.html">
            AI Assistant
        </a>

    </nav>

</header>


<main class="roadmap-page">


    <div class="roadmap-badge">
        PERSONALIZED ROADMAP
    </div>


    <!-- GOAL -->

    <h1 id="roadmapGoal">
        Your Learning Journey
    </h1>


    <p
        class="roadmap-subtitle"
        id="roadmapSubtitle"
    >
        Your personalized learning path
    </p>


    <!-- SUMMARY -->

    <section class="summary-grid">


        <div class="summary-card">

            <p>
                Goal Readiness
            </p>

            <strong id="readinessPercentage">
                0%
            </strong>

        </div>


        <div class="summary-card">

            <p>
                Skills You Have
            </p>

            <strong id="skillsHave">
                0
            </strong>

        </div>


        <div class="summary-card">

            <p>
                Skills To Learn
            </p>

            <strong id="skillsToLearn">
                0
            </strong>

        </div>


        <div class="summary-card">

            <p>
                Recommended Steps
            </p>

            <strong id="recommendedSteps">
                0
            </strong>

        </div>


    </section>


    <!-- SKILL GAP -->

    <section class="skill-gap">

        <div class="section-heading">

            <h2>
                Skill Gap
            </h2>

            <span id="readinessText">
                0% ready
            </span>

        </div>


        <div
            class="skill-tags"
            id="skillTags"
        >

        </div>

    </section>


    <!-- ROADMAP STEPS -->

    <section id="roadmapContainer">

    </section>


    <!-- RECOMMENDATIONS -->

    <section class="recommendations">

        <h2>
            Top AI Recommendations
        </h2>


        <div
            class="recommendation-grid"
            id="recommendationContainer"
        >

        </div>

    </section>


</main>


<script src="../js/roadmap.js"></script>


</body>

</html>
