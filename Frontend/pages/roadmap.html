<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LearnPath AI - Roadmap</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/roadmap.css"
    >
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🧠 LearnPath <span>AI</span>
        </div>

        <nav class="side-nav">

            <a href="profile.html">
                My Learning
            </a>

            <a
                href="roadmap.html"
                class="active"
            >
                Roadmaps
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="assistant.html">
                AI Assistant
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header
            class="top-bar"
            style="justify-content: flex-end;"
        >

            <div class="user-profile">

                <div class="user-info">

                    <!-- Dynamically populated from profile -->
                    <strong id="topNavName">
                        Student
                    </strong>

                    <span>
                        Student
                    </span>

                </div>

            </div>

        </header>


        <!-- ROADMAP HEADER -->
        <div class="roadmap-header">

            <h1>
                Your Learning Journey
            </h1>

            <p id="roadmapSubtitle">
                Estimated timeline based on your profile
            </p>

            <!-- Hidden data element used by JS -->
            <p
                id="roadmapGoal"
                style="display: none;"
            ></p>

        </div>


        <!-- =====================================================
             DYNAMIC SUMMARY
             ===================================================== -->

        <section class="summary-grid">

            <div class="summary-card">

                <p>
                    Goal Readiness
                </p>

                <!-- Backend/ML value -->
                <strong id="readinessPercentage">
                    0%
                </strong>

            </div>


            <div class="summary-card">

                <p>
                    Skills You Have
                </p>

                <!-- Number of current skills -->
                <strong id="skillsHave">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <p>
                    Skills To Learn
                </p>

                <!-- Number of skill gaps -->
                <strong id="skillsToLearn">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <p>
                    Recommended Steps
                </p>

                <!-- Number of courses returned by ML -->
                <strong id="recommendedSteps">
                    0
                </strong>

            </div>

        </section>


        <!-- =====================================================
             DYNAMIC SKILL MAP
             ===================================================== -->

        <section class="skill-gap">

            <h2>
                Skill Map
            </h2>

            <!--
                roadmap.js will dynamically create:

                ✓ Python
                ✓ Java
                → Machine Learning
                → Deep Learning

                based on the user's actual profile
                and backend recommendation.
            -->

            <div
                class="skill-tags"
                id="skillTags"
            ></div>

        </section>


        <!-- =====================================================
             DYNAMIC ROADMAP
             ===================================================== -->

        <section
            id="roadmapContainer"
        ></section>


        <!-- =====================================================
             AI RECOMMENDATIONS
             ===================================================== -->

        <section class="recommendations">

            <h2>
                Top AI Recommendations
            </h2>

            <div
                class="recommendation-grid"
                id="recommendationContainer"
            ></div>

        </section>

    </main>

</div>


<!-- =========================================================
     ROADMAP JAVASCRIPT
     ========================================================= -->

<script src="../js/roadmap.js"></script>


<!-- =========================================================
     TOP NAVIGATION USER NAME
     =========================================================

     IMPORTANT:
     We now use localStorage instead of sessionStorage
     because profile.js stores the current learner there.
     ========================================================= -->

<script>

    try {

        const savedProfile =
            JSON.parse(
                localStorage.getItem(
                    "learnPathProfile"
                )
            );

        if (
            savedProfile &&
            savedProfile.name
        ) {

            const topName =
                document.getElementById(
                    "topNavName"
                );

            if (topName) {

                topName.textContent =
                    savedProfile.name
                        .split(" ")[0];
            }
        }

    } catch (error) {

        console.error(
            "Unable to load profile name:",
            error
        );

    }

</script>

</body>
</html>
