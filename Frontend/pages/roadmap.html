<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LearnPath AI - Roadmap
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/roadmap.css"
    >

    <!-- =====================================================
         ROADMAP SUMMARY CARD COLORS
         Only the first four roadmap boxes are changed.
         No layout or functionality is changed.
         ===================================================== -->

    <style>

        /* =====================================================
           FIRST BOX
           Goal Readiness
           Same pink → purple style as Dashboard
           ===================================================== */

        .summary-grid .summary-card:nth-child(1) {
            background: linear-gradient(
                135deg,
                #ff5f6d 0%,
                #c471ed 100%
            ) !important;

            border: none !important;
            color: #ffffff !important;
        }


        /* =====================================================
           SECOND BOX
           Skills You Have
           Blue → Indigo
           ===================================================== */

        .summary-grid .summary-card:nth-child(2) {
            background: linear-gradient(
                135deg,
                #4361ee 0%,
                #3a0ca3 100%
            ) !important;

            border: none !important;
            color: #ffffff !important;
        }


        /* =====================================================
           THIRD BOX
           Skills To Learn
           Teal → Blue
           ===================================================== */

        .summary-grid .summary-card:nth-child(3) {
            background: linear-gradient(
                135deg,
                #2ec4b6 0%,
                #118ab2 100%
            ) !important;

            border: none !important;
            color: #ffffff !important;
        }


        /* =====================================================
           FOURTH BOX
           Recommended Steps
           Purple → Deep Purple
           ===================================================== */

        .summary-grid .summary-card:nth-child(4) {
            background: linear-gradient(
                135deg,
                #7209b7 0%,
                #3a0ca3 100%
            ) !important;

            border: none !important;
            color: #ffffff !important;
        }


        /* =====================================================
           KEEP TEXT WHITE INSIDE ALL FOUR COLORED BOXES
           ===================================================== */

        .summary-grid .summary-card:nth-child(1) p,
        .summary-grid .summary-card:nth-child(1) strong,

        .summary-grid .summary-card:nth-child(2) p,
        .summary-grid .summary-card:nth-child(2) strong,

        .summary-grid .summary-card:nth-child(3) p,
        .summary-grid .summary-card:nth-child(3) strong,

        .summary-grid .summary-card:nth-child(4) p,
        .summary-grid .summary-card:nth-child(4) strong {
            color: #ffffff !important;
        }

    </style>

</head>


<body>

<div class="app-container">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="logo">
            🧠 LearnPath <span>AI</span>
        </div>


        <nav class="side-nav">

            <a href="profile.html">
                My Learning
            </a>


            <a
                href="roadmap.html"
                class="active"
            >
                Roadmaps
            </a>


            <a href="dashboard.html">
                Dashboard
            </a>


            <a href="assistant.html">
                AI Assistant
            </a>

        </nav>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">


        <!-- =====================================================
             TOP BAR
             ===================================================== -->

        <header
            class="top-bar"
            style="justify-content: flex-end;"
        >

            <div class="user-profile">

                <div class="user-info">

                    <strong id="topNavName">
                        Student
                    </strong>

                    <span>
                        Student
                    </span>

                </div>

            </div>

        </header>


        <!-- =====================================================
             ROADMAP HEADER
             ===================================================== -->

        <div class="roadmap-header">

            <h1 id="roadmapTitle">
                Your Learning Journey
            </h1>


            <p id="roadmapSubtitle">
                Estimated timeline based on your profile
            </p>


            <p
                id="roadmapGoal"
                style="display:none;"
            ></p>

        </div>


        <!-- =====================================================
             SUMMARY CARDS
             ===================================================== -->

        <section
            class="summary-grid"
        >


            <!-- =================================================
                 1. GOAL READINESS
                 ================================================= -->

            <div class="summary-card">

                <p>
                    Goal Readiness
                </p>


                <strong
                    id="readinessPercentage"
                >
                    0%
                </strong>

            </div>


            <!-- =================================================
                 2. SKILLS YOU HAVE
                 ================================================= -->

            <div class="summary-card">

                <p>
                    Skills You Have
                </p>


                <strong
                    id="skillsHave"
                >
                    0
                </strong>

            </div>


            <!-- =================================================
                 3. SKILLS TO LEARN
                 ================================================= -->

            <div class="summary-card">

                <p>
                    Skills To Learn
                </p>


                <strong
                    id="skillsToLearn"
                >
                    0
                </strong>

            </div>


            <!-- =================================================
                 4. RECOMMENDED STEPS
                 ================================================= -->

            <div class="summary-card">

                <p>
                    Recommended Steps
                </p>


                <strong
                    id="recommendedSteps"
                >
                    0
                </strong>

            </div>

        </section>


        <!-- =====================================================
             SKILL MAP
             ===================================================== -->

        <section
            class="skill-gap"
        >

            <h2>
                Skill Map
            </h2>


            <div
                class="skill-tags"
                id="skillTags"
            ></div>

        </section>


        <!-- =====================================================
             ROADMAP
             ===================================================== -->

        <section
            id="roadmapContainer"
        ></section>


        <!-- =====================================================
             TOP AI RECOMMENDATIONS
             ===================================================== -->

        <section
            class="recommendations"
        >

            <h2>
                Top AI Recommendations
            </h2>


            <div
                class="recommendation-grid"
                id="recommendationContainer"
            ></div>

        </section>

    </main>

</div>


<!-- =====================================================
     ROADMAP JAVASCRIPT
     ===================================================== -->

<script src="../js/roadmap.js"></script>


</body>

</html>
